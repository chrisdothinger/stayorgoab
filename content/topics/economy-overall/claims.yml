claims:
- id: claim-economy-overall-001
  topic_slug: economy-overall
  text: Alberta's current economic baseline includes provincial fiscal documents, current Canadian internal-market arrangements, Canada's external trade-agreement framework, federal defence institutions, and the legal baseline that secession would require negotiation.
  status: source_supported
  source_ids: &economy_overall_sources
  - alberta-budget-documents-2026
  - alberta-budget-highlights-2026
  - canadian-free-trade-agreement
  - global-affairs-cusma-text
  - national-defence-main
  - scc-secession-reference
  risk: high
- id: claim-economy-overall-002
  topic_slug: economy-overall
  text: The strongest pro-independence case is that Alberta could pursue tax, regulatory, resource, spending, trade, and energy choices more closely aligned with its economic base and North American market exposure.
  status: inference
  source_ids: *economy_overall_sources
  risk: high
- id: claim-economy-overall-003
  topic_slug: economy-overall
  text: The strongest anti-independence caution is that transition uncertainty, market-access negotiation, institutional duplication, investor risk, debt and asset allocation, and defence or security arrangements could offset expected policy-control gains.
  status: inference
  source_ids: *economy_overall_sources
  risk: high
- id: claim-economy-overall-004
  topic_slug: economy-overall
  text: Closer U.S. alignment is a possible strategic direction, not a settled economic outcome; it would depend on counterparties, trade terms, energy-market conditions, fiscal capacity, and institution-building.
  status: inference
  source_ids:
  - alberta-budget-documents-2026
  - alberta-budget-highlights-2026
  - alberta-premiers-address-2026-02-19
  - canadian-free-trade-agreement
