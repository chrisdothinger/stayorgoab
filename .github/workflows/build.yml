name: build
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:content
      - run: npm run generate:search-index
      - run: npm run generate:audit-manifest
      - run: npm run validate:public-audit
      - run: npm run validate:citations
      - run: npm run validate:agents
      - run: npm run validate:secrets
      - run: npm run build
