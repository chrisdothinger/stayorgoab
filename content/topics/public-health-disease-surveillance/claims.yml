claims:
- id: claim-public-health-disease-surveillance-001
  topic_slug: public-health-disease-surveillance
  text: Current sources establish federal public-health and vaccine reporting baselines plus Alberta
    public-health law and immunization-policy baselines, but not independence transition terms
    for surveillance feeds, outbreak notices, vaccine adverse-event reporting, laboratory coordination,
    or cross-border alerts.
  status: source_supported
  source_ids:
  - public-health-agency-canada
  - canada-immunization-vaccine-safety
  - alberta-public-health-act
  - alberta-immunization-policy
  risk: high
- id: claim-public-health-disease-surveillance-002
  topic_slug: public-health-disease-surveillance
  text: A credible transition would need explicit arrangements for legal reporting, data sharing,
    laboratory coordination, vaccine reporting, outbreak alerts, emergency powers, and
    public communications.
  status: inference
  source_ids:
  - public-health-agency-canada
  - canada-immunization-vaccine-safety
  - alberta-public-health-act
  - alberta-immunization-policy
  risk: high
- id: claim-public-health-disease-surveillance-003
  topic_slug: public-health-disease-surveillance
  text: The pro-independence case is strongest if Alberta preserves provincial public-health capacity
    while negotiating formal interoperability with Canadian and cross-border public-health networks.
  status: inference
  source_ids:
  - public-health-agency-canada
  - canada-immunization-vaccine-safety
  - alberta-public-health-act
  - alberta-immunization-policy
  risk: high
- id: claim-public-health-disease-surveillance-004
  topic_slug: public-health-disease-surveillance
  text: The anti-independence caution is strongest because disease surveillance, vaccine reporting
    reporting, lab coordination, and outbreak alerts lose value when legal authority or data channels
    are delayed, duplicated, or disputed.
  status: inference
  source_ids:
  - public-health-agency-canada
  - canada-immunization-vaccine-safety
  - alberta-public-health-act
  - alberta-immunization-policy
  risk: high
