claims:
- id: claim-charter-rights-continuity-001
  topic_slug: charter-rights-continuity
  text: Current legal sources show that the Canadian Charter is part of Canada’s constitutional order and that Alberta also has a provincial Bill of Rights, but they do not settle what rights instrument, court structure, remedies, limitation clause, override power, or transition rule an independent Alberta would adopt.
  status: source_supported
  source_ids: &id001
  - canadian-charter-rights
  - alberta-bill-of-rights
  - scc-secession-reference
  risk: high
- id: claim-charter-rights-continuity-002
  topic_slug: charter-rights-continuity
  text: the strongest pro-independence case is that Alberta could entrench a rights framework intentionally, preserve familiar protections by legislation or constitution, and tailor institutions while making continuity a negotiated condition.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-charter-rights-continuity-003
  topic_slug: charter-rights-continuity
  text: 'the strongest caution is that Charter continuity is not something voters should assume from slogans: rights, remedies, courts, Indigenous constitutional protections, equality guarantees, language rights, and override rules would need legally binding transition design.'
  status: inference
  source_ids: *id001
  risk: high
- id: claim-charter-rights-continuity-004
  topic_slug: charter-rights-continuity
  text: 'This topic remains uncertainty-labelled: High; rights continuity would depend on constitutional negotiations, any new Alberta constitutional text, transitional legislation, courts, treaty and Indigenous rights treatment, and recognition by Canada and other governments.'
  status: source_supported
  source_ids: *id001
  risk: high
