claims:
- id: claim-international-recognition-001
  topic_slug: international-recognition
  text: A clear Alberta vote could carry constitutional significance and trigger negotiations, but it would not by itself create independence or automatic recognition.
  status: source_supported
  source_ids:
  - scc-secession-reference
  - clarity-act
  risk: high
- id: claim-international-recognition-002
  topic_slug: international-recognition
  text: International recognition would be more plausible after a lawful, negotiated, clearly democratic process with credible transition terms.
  status: inference
  source_ids:
  - scc-secession-reference
  - clarity-act
  - un-charter-self-determination
  - global-affairs-canada-main
  risk: high
- id: claim-international-recognition-003
  topic_slug: international-recognition
  text: A unilateral or disputed process could make recognition, treaty continuity, trade relationships, and organization participation harder.
  status: inference
  source_ids:
  - scc-secession-reference
  - clarity-act
  - constitution-act-1982-amending-procedures
  - global-affairs-cusma-text
  risk: high
- id: claim-international-recognition-004
  topic_slug: international-recognition
  text: Indigenous rights, UNDRIP implementation, treaty promises, resident protections, institutional capacity, and Canada’s position would be central to how outside actors assess legitimacy and stability.
  status: inference
  source_ids:
  - scc-secession-reference
  - canada-undrip-act
  - global-affairs-canada-main
  risk: high
