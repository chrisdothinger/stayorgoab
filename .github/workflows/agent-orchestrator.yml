name: agent-orchestrator
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
permissions:
  contents: read
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:agents
      - run: npm run validate:citations
      - run: npm run validate:public-audit
      - run: npm run validate:secrets
