claims:
- id: claim-energy-environment-001
  topic_slug: energy-environment
  text: >-
    Alberta already has a major upstream energy-governance baseline: provincial
    energy, oil-sands and royalty policy, the Alberta Energy Regulator, and
    provincial legislation assigning the AER a central regulatory role.
  status: source_supported
  source_ids:
  - alberta-energy
  - alberta-oil-sands
  - alberta-royalty-overview
  - alberta-energy-regulator
  - responsible-energy-development-act
  risk: medium
- id: claim-energy-environment-002
  topic_slug: energy-environment
  text: >-
    Energy development remains constrained by export routes and markets because
    oil and gas value depends on pipeline capacity, interprovincial or
    international infrastructure, destination markets, prices, and customers.
  status: source_supported
  source_ids:
  - cer-pipeline-profiles
  - cer-canada-oil-imports-exports
  - cer-canadas-energy-future-2023
  risk: high
- id: claim-energy-environment-003
  topic_slug: energy-environment
  text: >-
    Environmental regulation would require continuity planning because federal
    impact assessment, fisheries/pollution protections, emissions reporting, and
    climate-policy credibility currently affect project assessment and market
    confidence.
  status: source_supported
  source_ids:
  - impact-assessment-act
  - iaac-impact-assessment-process-overview
  - canada-fisheries-act
  - alberta-emissions-reduction-energy-development-plan
  - eccc-greenhouse-gas-emissions
  risk: high
- id: claim-energy-environment-004
  topic_slug: energy-environment
  text: >-
    Indigenous rights, consultation, and Aboriginal interests would need explicit
    transition treatment rather than being assumed away as ordinary resource
    administration.
  status: source_supported
  source_ids:
  - canada-undrip-act
  - scc-secession-reference
  risk: high
- id: claim-energy-environment-005
  topic_slug: energy-environment
  text: >-
    The strongest pro-independence case is conditional: Alberta could preserve
    AER functions, carry forward approvals and liabilities, align royalties and
    emissions policy, and negotiate export access as a national priority.
  status: inference
  source_ids:
  - alberta-energy-regulator
  - responsible-energy-development-act
  - alberta-royalty-overview
  - cer-pipeline-profiles
  - cer-canada-oil-imports-exports
  - alberta-emissions-reduction-energy-development-plan
  risk: medium
- id: claim-energy-environment-006
  topic_slug: energy-environment
  text: >-
    The strongest anti-independence / pro-federation caution is that independence
    could add uncertainty before adding capacity if pipeline jurisdiction,
    environmental-law continuity, Indigenous consultation, emissions credibility,
    financing, or buyer demand were unresolved.
  status: inference
  source_ids:
  - cer-pipeline-profiles
  - cer-canada-oil-imports-exports
  - cer-canadas-energy-future-2023
  - impact-assessment-act
  - iaac-impact-assessment-process-overview
  - canada-fisheries-act
  - canada-undrip-act
  - scc-secession-reference
  - eccc-greenhouse-gas-emissions
  risk: high
- id: claim-energy-environment-007
  topic_slug: energy-environment
  text: >-
    This topic remains high-medium uncertainty because current sources identify
    the institutions and constraints but do not provide signed transition terms
    for pipelines, federal environmental substitution, Indigenous consultation,
    emissions targets, export-market access, regulator continuity, or
    international recognition.
  status: source_supported
  source_ids:
  - alberta-energy-regulator
  - responsible-energy-development-act
  - cer-pipeline-profiles
  - impact-assessment-act
  - iaac-impact-assessment-process-overview
  - canada-undrip-act
  - scc-secession-reference
  - eccc-greenhouse-gas-emissions
  risk: high
