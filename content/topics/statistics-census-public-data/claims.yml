claims:
- id: claim-statistics-census-public-data-001
  topic_slug: statistics-census-public-data
  text: Current public records show federal statistical and census systems alongside Alberta public-data products, but they do not establish how a new statistical agency, census authority, privacy rules, data sharing, historical comparability, or official indicators would operate after independence.
  status: source_supported
  source_ids: &id001
  - statistics-canada-main
  - statistics-canada-census
  - alberta-regional-dashboard
  risk: medium
- id: claim-statistics-census-public-data-002
  topic_slug: statistics-census-public-data
  text: The strongest pro case is that alberta could seek a statistical system focused on provincial priorities, faster local data products, and metrics designed around Alberta policy decisions.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-statistics-census-public-data-003
  topic_slug: statistics-census-public-data
  text: The strongest caution is that governments, businesses, researchers, municipalities, and residents could lose comparability or reliability if census authority, data sharing, survey capacity, privacy rules, or official indicators were not continuous.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-statistics-census-public-data-004
  topic_slug: statistics-census-public-data
  text: 'This topic remains uncertainty-labelled: Medium; census authority, statistical-agency design, survey capacity, privacy rules, data sharing, historical comparability, official indicators, and continuity for governments, businesses, researchers, municipalities, and residents remain conditional on future decisions and evidence.'
  status: source_supported
  source_ids: *id001
  risk: medium
