claims:
  - id: claim-legal-001
    topic_slug: legal-process
    text: "A referendum result alone would not make Alberta independent."
    status: source_supported
    source_ids: ["scc-secession-reference", "clarity-act"]
    risk: high
  - id: claim-legal-002
    topic_slug: legal-process
    text: "The House of Commons must consider whether a secession question and majority are clear before federal negotiations."
    status: source_supported
    source_ids: ["clarity-act"]
    risk: high
  - id: claim-cpp-001
    topic_slug: cpp-pensions
    text: "The Canada Pension Plan contains a statutory path for a province to establish its own plan if legislative requirements are met."
    status: source_supported
    source_ids: ["osfi-chief-actuary-cpp"]
    risk: high
  - id: claim-cpp-002
    topic_slug: cpp-pensions
    text: "The final CPP withdrawal transfer amount is a federal Minister of Finance responsibility, not a number settled by Alberta's report alone."
    status: source_supported
    source_ids: ["osfi-chief-actuary-cpp"]
    risk: high
  - id: claim-indigenous-001
    topic_slug: indigenous-rights-treaties
    text: "The Secession Reference says Aboriginal interests would need to be taken into account in constitutional negotiations."
