claims:
- id: claim-legal-process-001
  topic_slug: legal-process
  text: 'A referendum can matter politically, but it does not by itself create independence. Current legal sources point to
    a sequence: democratic expression, clarity assessment, negotiations, and constitutional implementation if terms are agreed.'
  status: source_supported
  source_ids:
  - scc-secession-reference
  - clarity-act
  risk: high
- id: claim-legal-process-002
  topic_slug: legal-process
  text: A clear vote on a clear question would give independence advocates their strongest democratic mandate and could create
    a constitutional obligation for other governments to negotiate in good faith.
  status: inference
  source_ids: &id001
  - scc-secession-reference
  - clarity-act
  - elections-ab-referendum
  - elections-ab-initiative-process
  risk: high
- id: claim-legal-process-003
  topic_slug: legal-process
  text: 'The same legal sources make unilateral secession a weak claim: the result would still depend on Canada, constitutional
    actors, Indigenous interests, negotiated terms, and implementation law.'
  status: inference
  source_ids: *id001
  risk: high
- id: claim-legal-process-004
  topic_slug: legal-process
  text: 'This topic remains uncertainty-labelled: High for outcomes; medium for the basic legal sequence.'
  status: source_supported
  source_ids: *id001
  risk: high
