- id: claim-clear-question-majority-002
  topic_slug: clear-question-majority
  text: The strongest pro case is that a direct question and decisive result could create a democratic mandate that other
    governments would need to treat seriously.
  status: inference
  source_ids: &id001
  - clarity-act
