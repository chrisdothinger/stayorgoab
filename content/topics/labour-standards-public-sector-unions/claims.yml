claims:
- id: claim-labour-standards-public-sector-unions-001
  topic_slug: labour-standards-public-sector-unions
  text: Alberta already has provincial employment-standards, labour-relations, labour-board, and public-service legal infrastructure, so an independent Alberta would not need to invent every workplace rule from scratch.
  status: inference
  source_ids:
  - alberta-employment-standards
  - alberta-employment-standards-code
  - alberta-labour-relations
  - alberta-labour-relations-code
  - alberta-labour-relations-board
  - alberta-public-service-act
  risk: medium
- id: claim-labour-standards-public-sector-unions-002
  topic_slug: labour-standards-public-sector-unions
  text: Canada currently has federal labour and federal public-service employment/labour-relations statutes, so federal-sector workers and employers would need explicit successor rules or negotiated recognition in an independence transition.
  status: inference
  source_ids:
  - canada-labour-code
  - canada-public-service-labour-relations-act
  - canada-public-service-employment-act
  risk: high
- id: claim-labour-standards-public-sector-unions-003
  topic_slug: labour-standards-public-sector-unions
  text: Existing collective agreements, union certifications, labour-board orders, complaints, grievances, arbitrations, and essential-service arrangements could be preserved by transition legislation, but they should not be treated as automatically settled without clear successor provisions.
  status: inference
  source_ids:
  - canada-labour-code
  - canada-public-service-labour-relations-act
  - alberta-employment-standards-code
  - alberta-labour-relations-code
  - alberta-labour-relations-board
  risk: high
- id: claim-labour-standards-public-sector-unions-004
  topic_slug: labour-standards-public-sector-unions
  text: 'The main uncertainty is administrative and legal continuity: which rules apply on day one, who enforces them, how active cases transfer, and how public-sector bargaining and essential services continue during transition.'
  status: inference
  source_ids:
  - canada-labour-code
  - canada-public-service-labour-relations-act
  - canada-public-service-employment-act
