claims:
- id: claim-immigration-passports-mobility-001
  topic_slug: immigration-passports-mobility
  text: Canadian citizenship, Canadian passports, Charter mobility rights, immigration status, and the ability to live or work across Canada are currently governed by Canadian federal legal and administrative systems rather than by Alberta alone.
  status: source_supported
  source_ids:
  - constitution-act-1982-charter
  - citizenship-act
  - canadian-passport-order
  - immigration-refugee-protection-act
  - ircc-main
  - canadian-passports
  risk: high
- id: claim-immigration-passports-mobility-002
  topic_slug: immigration-passports-mobility
  text: Alberta independence would not by itself settle whether Albertans keep Canadian citizenship, Canadian passport eligibility, permanent residence, or Canada-wide live/work rights; those outcomes would depend on Canadian law, Alberta law, and negotiated transition arrangements.
  status: inference
  source_ids:
  - scc-secession-reference
  - clarity-act
  - constitution-act-1982-charter
  - citizenship-act
  - canadian-passport-order
  - immigration-refugee-protection-act
  risk: high
- id: claim-immigration-passports-mobility-003
  topic_slug: immigration-passports-mobility
  text: The strongest pro-independence case is that Canada and Alberta would have practical reasons to negotiate continuity for existing citizens, passports, permanent residents, workers, students, families, and cross-border mobility before any transition date.
  status: inference
  source_ids:
  - scc-secession-reference
  - clarity-act
  - citizenship-act
  - canadian-passport-order
  - immigration-refugee-protection-act
  risk: medium
- id: claim-immigration-passports-mobility-004
  topic_slug: immigration-passports-mobility
  text: The strongest anti-independence caution is that current citizenship, passport, immigration, residency, and mobility protections are embedded in Canadian systems and would become uncertain unless counterparties accepted replacement or continuity terms.
  status: inference
  source_ids:
  - constitution-act-1982-charter
  - citizenship-act
  - canadian-passport-order
  - immigration-refugee-protection-act
  - ircc-main
  - canadian-passports
  risk: high
- id: claim-immigration-passports-mobility-005
  topic_slug: immigration-passports-mobility
  text: This topic remains high-uncertainty because the checked record does not yet contain binding Canada-Alberta citizenship, passport, immigration, residency, or labour-mobility terms for an independence transition.
  status: source_supported
  source_ids:
  - scc-secession-reference
  - clarity-act
  - constitution-act-1982-charter
  - citizenship-act
  - canadian-passport-order
  - immigration-refugee-protection-act
  - ircc-main
  - canadian-passports
  risk: high
