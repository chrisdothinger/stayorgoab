claims:
- id: claim-military-security-001
  topic_slug: military-security
  text: Alberta would need negotiated continuity or new institutions for defence, border enforcement, federal policing functions, emergency management, intelligence coordination, and critical infrastructure protection.
  status: inference
  source_ids:
  - scc-secession-reference
  - national-defence-main
  - public-safety-canada-emergency-management
  - rcmp-contract-policing
  - cbsa-main
  risk: high
- id: claim-military-security-002
  topic_slug: military-security
  text: Alberta already has provincial public-safety and emergency-management responsibilities, which could provide a partial institutional base but not a complete national-security system.
  status: inference
  source_ids:
  - alberta-policing
  - alberta-emergency-management
  risk: medium
- id: claim-military-security-003
  topic_slug: military-security
  text: Canada currently supplies national defence, border services, emergency-management coordination, and federal policing structures; replacing or renegotiating that stack would be a major transition task.
  status: inference
  source_ids:
  - national-defence-main
  - public-safety-canada-emergency-management
  - rcmp-contract-policing
  - cbsa-main
  risk: high
- id: claim-military-security-004
  topic_slug: military-security
  text: A lawful negotiated process would reduce security-continuity risk, while a unilateral or rushed transition would raise it.
  status: inference
  source_ids:
  - scc-secession-reference
  - clarity-act
  - national-defence-main
  - cbsa-main
  risk: high
