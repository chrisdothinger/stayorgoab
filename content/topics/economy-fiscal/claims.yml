claims:
- id: claim-economy-fiscal-001
  topic_slug: economy-fiscal
  text: Alberta has a current fiscal baseline, but that baseline does not answer the independence question by itself. Independence
    scenarios depend on negotiated costs, revenue changes, and institutional choices.
  status: source_supported
  source_ids:
  - alberta-budget-documents-2026
  - alberta-budget-highlights-2026
  risk: high
- id: claim-economy-fiscal-002
  topic_slug: economy-fiscal
  text: 'The strongest pro case is fiscal control: Alberta could keep more policy authority over taxes, resource revenue,
    regulation, and spending priorities.'
  status: inference
  source_ids: &id001
  - alberta-budget-documents-2026
  - alberta-budget-highlights-2026
  - alberta-premiers-address-2026-02-19
  risk: high
- id: claim-economy-fiscal-003
  topic_slug: economy-fiscal
  text: 'The strongest caution is transition exposure: debt allocation, duplicated institutions, service costs, market reaction,
    and trade uncertainty could offset claimed fiscal gains.'
  status: inference
  source_ids: *id001
  risk: high
- id: claim-economy-fiscal-004
  topic_slug: economy-fiscal
  text: 'This topic remains uncertainty-labelled: High; outcomes depend on assumptions about revenue, trade, debt, institutions,
    and transition costs.'
  status: source_supported
  source_ids: *id001
  risk: high
