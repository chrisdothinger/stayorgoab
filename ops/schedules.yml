schedules:
  - id: official-status-daily-audit
    workflow: .github/workflows/agent-orchestrator.yml
    cron: "17 14 * * *"
    timezone: America/Edmonton
    purpose: "Check official status sources and update public status if source-supported changes are found."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - content source updates
      - public status summaries
      - audit manifest updates
    required_checks:
      - validate:citations
      - validate:public-audit
      - validate:secrets
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: weekly-redebate
    workflow: .github/workflows/redebate-topic.yml
    cron: "23 16 * * 2"
    timezone: America/Edmonton
    purpose: "Review high-risk topics for source changes and redebate triggers."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - topic redebate logs
      - updated claim risk notes
    required_checks:
      - test:content
      - validate:citations
      - validate:public-audit
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: dossier-factory-buildout
    workflow: .github/workflows/dossier-factory.yml
    cron: "11 09 * * 3"
    timezone: America/Edmonton
    purpose: "Expand partial questions into source-backed neutral, pro, anti, claims, and source-ledger dossiers."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - topic report drafts
      - claims.yml updates
      - sources.yml updates
      - audit-log.yml updates
    required_checks:
      - test:content
      - validate:citations
      - validate:public-audit
      - validate:secrets
      - test:a11y
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: source-discovery
    workflow: .github/workflows/source-discovery.yml
    cron: "41 10 * * 1,4"
    timezone: America/Edmonton
    purpose: "Find official, legal, institutional, and high-value public sources that could improve topic dossiers."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - source candidate summaries
      - source library records
      - topic source links
    required_checks:
      - validate:citations
      - validate:public-audit
      - validate:secrets
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: new-question-scout
    workflow: .github/workflows/new-question-scout.yml
    cron: "29 12 * * 5"
    timezone: America/Edmonton
    purpose: "Identify emerging Alberta independence questions that deserve transparent topic pages."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - question candidates
      - content planning files
      - sparse topic seeds
    required_checks:
      - test:content
      - validate:public-audit
      - validate:secrets
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: current-events-monitor
    workflow: .github/workflows/current-events-monitor.yml
    cron: "07 15 * * *"
    timezone: America/Edmonton
    purpose: "Track current events that may require source checks, uncertainty updates, or dossier refreshes."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - update flags
      - source-check summaries
      - changelog entries
    required_checks:
      - validate:citations
      - validate:public-audit
      - validate:secrets
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: citation-claim-integrity-audit
    workflow: .github/workflows/citation-integrity.yml
    cron: "53 13 * * 0"
    timezone: America/Edmonton
    purpose: "Check that public claims still resolve to defined source IDs and do not overstate sparse records."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - citation issue summaries
      - claim downgrades
      - public audit manifest updates
    required_checks:
      - validate:citations
      - validate:public-audit
      - validate:secrets
      - test:content
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
  - id: public-release-rollback
    workflow: .github/workflows/pages-release.yml
    cron: "on push to main / rollback on failed checks"
    timezone: America/Edmonton
    purpose: "Publish static site output after validators pass; withhold or roll back if gates fail."
    latest_successful_run: pending / not yet recorded
    allowed_outputs:
      - static site export
      - release summaries
      - rollback incident records
    required_checks:
      - test:content
      - validate:citations
      - validate:public-audit
      - validate:secrets
      - validate:agents
      - test
      - lint
      - typecheck
      - test:a11y
      - build
    public_log_level: summarized
    publish_raw_logs: false
    human_gate: false
