agents:
  - id: orchestrator
    name: "Orchestrator Agent"
    level: L4
    purpose: "Coordinate scheduled workflows, route source updates, and update public run summaries."
    persona: agents/personas/orchestrator.md
    prompts:
      - agents/prompts/redebate-scheduler.md
      - agents/prompts/release.md
    rubrics:
      - agents/rubrics/ai-engineering-critic.md
  - id: source-steward
    name: "Source Steward Agent"
    level: L2
    purpose: "Discover, classify, and maintain source records, including base, pro-source, anti-source, and counterargument research lanes for new-style dossiers."
    persona: agents/personas/source-steward.md
    prompts:
      - agents/prompts/source-discovery.md
    rubrics:
      - agents/rubrics/source-quality.md
  - id: pro-source-researcher
    name: "Pro-Source Research Agent"
    level: L2
    purpose: "Find credible current sources and argument ammunition for the strongest fair pro-independence case, while recording counterarguments and source limits."
    persona: agents/personas/pro-source-researcher.md
    prompts:
      - agents/prompts/pro-report.md
    rubrics:
      - agents/rubrics/source-quality.md
      - agents/rubrics/dossier-debate-brief-framework.md
  - id: anti-source-researcher
    name: "Anti-Source Research Agent"
    level: L2
    purpose: "Find credible current sources and argument ammunition for the strongest fair anti-independence/pro-federation case, while recording counterarguments and source limits."
    persona: agents/personas/anti-source-researcher.md
    prompts:
      - agents/prompts/anti-report.md
    rubrics:
      - agents/rubrics/source-quality.md
      - agents/rubrics/dossier-debate-brief-framework.md
  - id: claim-citation
    name: "Claim & Citation Agent"
    level: L2
    purpose: "Extract claims and maintain claim-source mappings."
    persona: agents/personas/claim-citation.md
    prompts:
      - agents/prompts/claim-extraction.md
    rubrics:
      - agents/rubrics/source-quality.md
  - id: topic-writer
    name: "Topic Writer Agent"
    level: L3
    purpose: "Draft Q1-standard public-reader overviews plus pro/anti debate briefs only after the topic-question gate confirms the question is public-facing, unique, and high-value."
    persona: agents/personas/topic-writer.md
    prompts:
      - agents/prompts/neutral-synthesis.md
      - agents/prompts/pro-report.md
      - agents/prompts/anti-report.md
    rubrics:
      - agents/rubrics/reader-first-dossier-writing.md
      - agents/rubrics/dossier-debate-brief-framework.md
  - id: topic-question-auditor
    name: "Topic Question Auditor"
    level: L3
    purpose: "Score candidate questions for sensitivity, uniqueness, answerability, public importance, and reader value; flag repetitive topics for merge/split before dossier migration."
    persona: agents/personas/topic-question-auditor.md
    prompts:
      - agents/prompts/auditor.md
    rubrics:
      - agents/rubrics/reader-first-dossier-writing.md
  - id: synthesis-auditor
    name: "Synthesis & Risk Audit Agent"
    level: L3
    purpose: "Audit neutrality, bias, false balance, high-risk policy language, Q1 structure, source depth, and public formatting consistency."
    persona: agents/personas/synthesis-auditor.md
    prompts:
      - agents/prompts/neutral-synthesis.md
    rubrics:
      - agents/rubrics/reader-first-dossier-writing.md
      - agents/rubrics/dossier-debate-brief-framework.md
  - id: release-rollback
    name: "Release & Rollback Agent"
    level: L6
    purpose: "Publish passing builds, update release logs, and roll back failed releases."
    persona: agents/personas/release-rollback.md
    prompts:
      - agents/prompts/release.md
    rubrics:
      - agents/rubrics/ai-engineering-critic.md
