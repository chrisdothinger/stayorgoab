claims:
- id: claim-rcmp-provincial-policing-001
  topic_slug: rcmp-provincial-policing
  text: Alberta currently has provincial policing responsibilities and an Alberta Police Act framework, while RCMP contract policing remains an important part of service delivery in many Alberta communities.
  status: source_supported
  source_ids:
  - alberta-policing
  - rcmp-contract-policing
  - rcmp-alberta
  - alberta-police-act
  risk: medium
- id: claim-rcmp-provincial-policing-002
  topic_slug: rcmp-provincial-policing
  text: Alberta has examined a possible Alberta Police Service transition, but the study material does not by itself prove a ready independence-era police service, final staffing model, or guaranteed costs.
  status: source_supported
  source_ids:
  - alberta-police-transition-study
  risk: medium
- id: claim-rcmp-provincial-policing-003
  topic_slug: rcmp-provincial-policing
  text: A pro-independence policing case is strongest when it proposes negotiated continuity, staged implementation, local accountability, and funded service standards rather than assuming the current RCMP model automatically continues or instantly disappears.
  status: inference
  source_ids:
  - alberta-policing
  - alberta-police-transition-study
  - rcmp-contract-policing
  - alberta-police-act
  risk: medium
- id: claim-rcmp-provincial-policing-004
  topic_slug: rcmp-provincial-policing
  text: The main transition risk is operational continuity for emergency response, investigations, dispatch, records, labs, officer staffing, municipal policing, Indigenous policing, court support, and oversight.
  status: inference
  source_ids:
  - alberta-policing
  - rcmp-contract-policing
  - rcmp-alberta
  - alberta-police-act
  risk: high
- id: claim-rcmp-provincial-policing-005
  topic_slug: rcmp-provincial-policing
  text: The dossier uncertainty is medium-high until public documents show written policing agreements, budgets, staffing, data access, municipal and Indigenous arrangements, and tested readiness plans.
  status: inference
  source_ids:
  - alberta-policing
  - alberta-police-transition-study
  - rcmp-contract-policing
  - rcmp-alberta
  - alberta-police-act
  risk: high
