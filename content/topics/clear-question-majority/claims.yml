claims:
- id: claim-clear-question-majority-001
  topic_slug: clear-question-majority
  text: Clear question and clear majority are legitimacy tests, not just slogans. Current sources do not reduce every scenario
    to one fixed percentage or magic wording.
  status: source_supported
  source_ids:
  - clarity-act
  - scc-secession-reference
