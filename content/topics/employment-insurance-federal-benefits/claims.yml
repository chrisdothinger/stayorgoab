claims:
- id: claim-employment-insurance-federal-benefits-001
  topic_slug: employment-insurance-federal-benefits
  text: "Current sources establish that Albertans now interact with federal employment/social-development and benefits systems alongside Alberta income support; they do not establish post-independence continuity terms for EI or federal income benefits."
  status: source_supported
  source_ids: &topic_sources
  - employment-social-development-canada
  - service-canada-benefits
  - alberta-income-support
  risk: medium
- id: claim-employment-insurance-federal-benefits-002
  topic_slug: employment-insurance-federal-benefits
  text: "The strongest pro-independence case is conditional: Alberta could seek negotiated continuity and legislate funded successor programs before any federal benefit access changed."
  status: inference
  source_ids: *topic_sources
  risk: medium
- id: claim-employment-insurance-federal-benefits-003
  topic_slug: employment-insurance-federal-benefits
  text: "The strongest anti-independence / pro-federation case is that benefit continuity requires binding agreements, funding, records, service capacity, and appeal protections before claimants can safely rely on it."
  status: inference
  source_ids: *topic_sources
  risk: medium
- id: claim-employment-insurance-federal-benefits-004
  topic_slug: employment-insurance-federal-benefits
  text: "Alberta's existing income-support program is relevant evidence of provincial benefit administration, but it is not evidence that Alberta already replaces the full federal EI and income-benefit system."
  status: source_supported
  source_ids:
  - service-canada-benefits
  - alberta-income-support
  risk: medium
- id: claim-employment-insurance-federal-benefits-005
  topic_slug: employment-insurance-federal-benefits
  text: "The practical test for this topic is a program-by-program continuity plan covering payment authority, eligibility records, applications, pending claims, appeals, data sharing, funding, and fallback payments."
  status: inference
  source_ids: *topic_sources
  risk: medium
