    Reframed the dossier around the practical test for aviation continuity: safety authority, airport operations, screening, passenger rules, international air links, airline readiness, and signed transition evidence.
- id: redebate-air-transport-aviation-safety-2026-05-06-source-coverage
  date: '2026-05-06'
  trigger: batch-2-source-coverage-blocker
  summary: >-
    Re-ran the pro/anti/neutral framing with targeted aviation sources added for ICAO international civil-aviation obligations, NAV CANADA air navigation services, Transport Canada airport certification, and CTA air transport agreements. The resulting synthesis keeps the issue conditional: continuity is possible only with signed safety, airport, screening, air-navigation, passenger-rule, and international-recognition arrangements; disruption is not assumed without identifying which function cannot be bridged.
