claims:
- id: claim-air-transport-aviation-safety-001
  topic_slug: air-transport-aviation-safety
  text: Current public records show federal aviation safety and transportation-regulator
    roles alongside Alberta transportation infrastructure responsibilities, but they
    do not establish how aviation safety certification, airport operations, air-service
    agreements, security, or passenger protections would operate after independence.
  status: source_supported
  source_ids: &id001
  - transport-canada-aviation
  - canadian-transportation-agency
  - alberta-transportation-economic-corridors
  risk: medium
- id: claim-air-transport-aviation-safety-002
  topic_slug: air-transport-aviation-safety
  text: The strongest pro case is that alberta could seek transport policy and infrastructure
    priorities tailored to its airports, northern access, trade corridors, and regional
    connectivity.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-air-transport-aviation-safety-003
  topic_slug: air-transport-aviation-safety
  text: The strongest caution is that airlines, airports, passengers, cargo shippers,
    and insurers could face uncertainty if safety certification, regulator recognition,
    security screening, international air agreements, or passenger-protection rules
    were not continuous.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-air-transport-aviation-safety-004
  topic_slug: air-transport-aviation-safety
  text: 'This topic remains uncertainty-labelled: Medium; aviation safety authority,
    airport operations, security screening, international air-service agreements,
    regulator recognition, passenger protections, insurance, and continuity for carriers
    and travellers remain conditional on future decisions and evidence.'
  status: source_supported
  source_ids: *id001
  risk: medium
