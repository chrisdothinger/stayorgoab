  - global-affairs-canada-main
  - national-defence-main
  - statistics-canada-main
  - employment-social-development-canada
  risk: high
- id: claim-bureaucracy-governance-002
  topic_slug: bureaucracy-governance
  text: Some institutions could likely be phased or bridged through temporary service
    arrangements, but critical public functions would need explicit day-one continuity
    plans.
  status: inference
  source_ids: &id001
  - scc-secession-reference
