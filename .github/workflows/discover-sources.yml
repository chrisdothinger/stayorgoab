name: discover-sources
on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 1,4"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:citations
      - run: npm run validate:public-audit
      - run: npm run validate:secrets
