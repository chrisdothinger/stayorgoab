claims:
- id: claim-federal-prisons-corrections-parole-001
  topic_slug: federal-prisons-corrections-parole
  text: Federal corrections, federal conditional release, parole decision-making, and Alberta provincial correctional centres are currently split across Canadian federal institutions, federal law, and Alberta correctional systems rather than controlled by Alberta alone.
  status: source_supported
  source_ids:
  - correctional-service-canada
  - corrections-conditional-release-act
  - parole-board-canada
  - alberta-adult-correctional-remand-centres
  - alberta-corrections-act
  risk: high
- id: claim-federal-prisons-corrections-parole-002
  topic_slug: federal-prisons-corrections-parole
  text: Alberta independence would not by itself settle custody authority, parole-board authority, sentence administration, inmate transfer arrangements, records, victims services, staff status, or supervision for federal offenders in or connected to Alberta.
  status: inference
  source_ids:
  - correctional-service-canada
  - corrections-conditional-release-act
  - parole-board-canada
  - csc-sentence-calculation
  - alberta-corrections-act
  risk: high
- id: claim-federal-prisons-corrections-parole-003
  topic_slug: federal-prisons-corrections-parole
  text: The strongest pro-independence case is that Alberta could legislate and negotiate a corrections and parole transition that preserves custody continuity while creating an Alberta-accountable system for facilities, parole, sentence administration, transfers, and community supervision.
  status: inference
  source_ids:
  - correctional-service-canada
  - corrections-conditional-release-act
  - parole-board-canada
  - alberta-adult-correctional-remand-centres
  - csc-sentence-calculation
  - alberta-corrections-act
  risk: medium
- id: claim-federal-prisons-corrections-parole-004
  topic_slug: federal-prisons-corrections-parole
  text: The strongest anti-independence caution is that corrections and parole require continuous lawful authority, accurate sentence records, secure facilities, trained staff, transport powers, victim notification, and community supervision, so any transition gap would be a serious public-safety and rights risk.
  status: inference
  source_ids:
  - correctional-service-canada
  - corrections-conditional-release-act
  - parole-board-canada
  - csc-sentence-calculation
  - alberta-corrections-act
  risk: high
- id: claim-federal-prisons-corrections-parole-005
  topic_slug: federal-prisons-corrections-parole
  text: This topic remains high-uncertainty because the checked record does not contain binding Canada-Alberta terms assigning federal inmates, federal institutions, parole files, sentence calculations, transfer powers, or community-supervision duties after an independence transition.
  status: source_supported
  source_ids:
  - correctional-service-canada
  - corrections-conditional-release-act
  - parole-board-canada
  - alberta-adult-correctional-remand-centres
  - csc-sentence-calculation
  - alberta-corrections-act
  risk: high
