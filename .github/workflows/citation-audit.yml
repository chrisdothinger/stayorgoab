name: citation-audit
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  citation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:citations
