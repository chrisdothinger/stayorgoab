claims:
- id: claim-abortion-reproductive-health-rights-001
  topic_slug: abortion-reproductive-health-rights
  text: Current sources establish the existing post-Morgentaler legal baseline, Canada Health Act health-system principles, and Alberta Health Services public service information.
  status: source_supported
  source_ids: &abortion_sources
  - scc-morgentaler-1988
  - canada-health-act
  - ahs-abortion-services
  risk: high
- id: claim-abortion-reproductive-health-rights-002
  topic_slug: abortion-reproductive-health-rights
  text: Alberta could choose to preserve current abortion access through transition legislation, health funding rules, clinical guidance, service pathways, privacy protections, and regulator instructions.
  status: inference
  source_ids: *abortion_sources
  risk: high
- id: claim-abortion-reproductive-health-rights-003
  topic_slug: abortion-reproductive-health-rights
  text: Reproductive-health access could be affected quickly if legal authority, public funding, provider guidance, facility access, referral pathways, privacy rules, or remedies were unclear during transition.
  status: inference
  source_ids: *abortion_sources
  risk: high
- id: claim-abortion-reproductive-health-rights-004
  topic_slug: abortion-reproductive-health-rights
  text: Formal legality and practical access are separate questions; patients and clinicians would need clear rules for insured services, referrals, medication and procedural care, emergency care, follow-up care, privacy, and complaints.
  status: inference
  source_ids: *abortion_sources
  risk: high
- id: claim-abortion-reproductive-health-rights-005
  topic_slug: abortion-reproductive-health-rights
  text: Current sources do not settle how an independent Alberta would protect, fund, regulate, restrict, or expand reproductive-health services.
  status: inference
  source_ids: *abortion_sources
  risk: high
