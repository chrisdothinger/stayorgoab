claims:
- id: claim-bureaucracy-governance-001
  topic_slug: bureaucracy-governance
  text: An independent Alberta would need national institutional capacity for functions
    now handled partly or wholly by Canada, including tax, immigration, border, financial
    regulation, emergency coordination, foreign affairs, defence-adjacent interfaces,
    and federal-program administration.
  status: source_supported
  source_ids:
