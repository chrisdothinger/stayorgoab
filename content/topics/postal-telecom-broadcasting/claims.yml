claims:
- id: claim-postal-telecom-broadcasting-001
  topic_slug: postal-telecom-broadcasting
  text: Current public records show national postal services, federal communications regulation, and federal spectrum-management functions, but they do not establish how an independent Alberta would maintain mail delivery, carrier regulation, spectrum licences, or broadcasting rules.
  status: source_supported
  source_ids: &id001
  - canada-post
  - crtc-main
  - ised-spectrum-management
  risk: medium
- id: claim-postal-telecom-broadcasting-002
  topic_slug: postal-telecom-broadcasting
  text: The strongest pro-independence case is that Alberta could design a communications regime around local accountability, rural connectivity, affordability, competition, emergency resilience, and consumer protection if continuity agreements and regulator capacity were built first.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-postal-telecom-broadcasting-003
  topic_slug: postal-telecom-broadcasting
  text: The strongest anti-independence caution is that postal delivery, carrier obligations, spectrum rights, broadcasting rules, emergency communications, and consumer protections could become complicated if federal systems were interrupted or renegotiated without binding bridge arrangements.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-postal-telecom-broadcasting-004
  topic_slug: postal-telecom-broadcasting
  text: This topic remains medium-uncertainty because source-backed current federal baselines do not answer future transition design, institutional capacity, service continuity, or negotiated recognition questions.
  status: inference
  source_ids: *id001
  risk: medium
