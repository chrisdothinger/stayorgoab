claims:
- id: claim-firearms-laws-licensing-001
  topic_slug: firearms-laws-licensing
  text: Canada's current firearms baseline includes the Firearms Act, RCMP Canadian Firearms Program administration, Criminal Code firearm offences and prohibitions, and Alberta Chief Firearms Office functions within the Canadian framework.
  status: source_supported
  source_ids:
  - firearms-act
  - rcmp-canadian-firearms-program
  - criminal-code-canada
  - alberta-chief-firearms-office
  risk: medium
- id: claim-firearms-laws-licensing-002
  topic_slug: firearms-laws-licensing
  text: An independent Alberta could choose a different firearms policy direction, but licences, restricted-firearm records, authorizations, offences, prohibitions, safe-storage rules, and enforcement authority would need explicit day-one continuity rules.
  status: inference
  source_ids:
  - firearms-act
  - rcmp-canadian-firearms-program
  - criminal-code-canada
  - alberta-chief-firearms-office
  risk: high
- id: claim-firearms-laws-licensing-003
  topic_slug: firearms-laws-licensing
  text: The pro-independence case is strongest when it proposes continuity first and policy reform second, including draft statutes, licensing operations, data arrangements, classification tables, and public owner guidance.
  status: inference
  source_ids:
  - firearms-act
  - rcmp-canadian-firearms-program
  - criminal-code-canada
  - alberta-chief-firearms-office
  risk: medium
- id: claim-firearms-laws-licensing-004
  topic_slug: firearms-laws-licensing
  text: The anti-independence or pro-federation case is strongest when it identifies specific transition risks in licensing data, RCMP program functions, criminal-law provisions, police and court enforcement, imports, exports, and cross-border recognition.
  status: inference
  source_ids:
  - firearms-act
  - rcmp-canadian-firearms-program
  - criminal-code-canada
  - alberta-chief-firearms-office
  risk: high
- id: claim-firearms-laws-licensing-005
  topic_slug: firearms-laws-licensing
  text: Uncertainty remains high until public documents show firearms-transition legislation, administrative capacity, data access, police and court protocols, border agreements, classification proposals, and readiness review.
  status: inference
  source_ids:
  - firearms-act
  - rcmp-canadian-firearms-program
  - criminal-code-canada
  - alberta-chief-firearms-office
  risk: high
