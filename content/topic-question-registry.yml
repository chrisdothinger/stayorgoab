version: 2026-05-06-topic-question-standard-v2-overlap-sweep
purpose: Harden StayOrGoAB topic selection around sensitive, unique, critical, high-value public questions with structured overlap review before
  broad dossier migration.
scoring_scale:
  public_importance: '1-5: real-world civic or personal stakes'
  sensitivity: '1-5: controversy, rights, money, identity, safety, or trust implications'
  uniqueness: '1-5: distinct from existing dossiers'
  answerability: '1-5: credible public sources can support a fair dossier'
  reader_value: '1-5: likely usefulness to voters, journalists, policymakers, or affected groups'
decision_meanings:
  keep: Question is distinct enough to refresh/migrate as a dossier.
  reframe: Keep the area, but sharpen the question before dossier migration.
  merge_candidate: Likely duplicate/overlap; resolve before dossier migration.
  split_candidate: Topic is too bundled; split into sharper questions or choose one primary question before migration.
  cancel_duplicate: Question should not remain a public dossier candidate because another canonical question covers the same reader need.
acceptance_gate: New or refreshed topics should score at least 16/25, be phrased as a question, include research lanes, and include structured
  overlap_review against same-family or adjacent questions.
