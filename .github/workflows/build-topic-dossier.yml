name: build-topic-dossier
on:
  workflow_dispatch:
    inputs:
      topic:
        required: true
        type: string
permissions:
  contents: read
jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:content
      - run: npm run validate:dossier-migration
      - run: npm run validate:citations
      - run: npm run validate:public-audit
      - run: npm run validate:secrets
