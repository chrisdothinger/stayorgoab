claims:
- id: claim-referendum-ballot-2026-001
  topic_slug: referendum-ballot-2026
  text: Elections Alberta issued a citizen initiative petition titled A Referendum Relating to Alberta Independence on January 2,
    2026, with a proposed question asking whether Alberta should cease to be part of Canada and become an independent state.
  status: source_supported
  source_ids:
  - elections-ab-new-citizen-initiative-2026-01-02
  risk: high
- id: claim-referendum-ballot-2026-002
  topic_slug: referendum-ballot-2026
  text: Elections Alberta listed the independence petition threshold as 177,732 signatures, equal to 10% of votes cast in the
    2023 provincial general election, with a collection period from January 3 to May 2, 2026.
  status: source_supported
  source_ids:
  - elections-ab-new-citizen-initiative-2026-01-02
  - elections-ab-current-petitions
  risk: high
- id: claim-referendum-ballot-2026-003
  topic_slug: referendum-ballot-2026
  text: Alberta's citizen initiative petition process is a gateway process and should not be described as final referendum ballot
    certification unless official referendum-ordering documents support that later step.
  status: inference
  source_ids:
  - elections-ab-current-petitions
  - elections-ab-initiative-process
  - elections-ab-referendum
  - alberta-referendum-act
  risk: high
- id: claim-referendum-ballot-2026-004
  topic_slug: referendum-ballot-2026
  text: Alberta referendum materials and the Referendum Act describe a provincial referendum framework, but readers still need
    the exact official question and authority to know whether an independence question is on a 2026 ballot.
  status: source_supported
  source_ids:
  - elections-ab-referendum
  - alberta-referendum-2026
  - alberta-referendum-act
  risk: high
- id: claim-referendum-ballot-2026-005
  topic_slug: referendum-ballot-2026
  text: A clear Alberta independence referendum result could create political or constitutional pressure for negotiations, but it
    would not by itself settle Canada's secession rules or implementation questions.
  status: inference
  source_ids:
  - clarity-act
  - scc-secession-reference
  - alberta-referendum-act
  risk: high
- id: claim-referendum-ballot-2026-006
  topic_slug: referendum-ballot-2026
  text: The current public assessment can change with new Elections Alberta status updates, official ballot wording, Orders in Council,
    referendum notices, court rulings, or intergovernmental responses.
  status: source_supported
  source_ids:
  - elections-ab-current-petitions
  - elections-ab-referendum
  - alberta-referendum-2026
  risk: high
