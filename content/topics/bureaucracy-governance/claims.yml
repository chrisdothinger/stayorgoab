- id: claim-bureaucracy-governance-003
  topic_slug: bureaucracy-governance
  text: Building national institutions would require legal authority, budgets, staff,
    systems, records, recognition, and implementation timelines rather than only a
    political mandate.
  status: inference
  source_ids: *id001
  risk: high
- id: claim-bureaucracy-governance-004
  topic_slug: bureaucracy-governance
  text: The current public source record identifies institutional categories and baseline
    functions, but total cost, timeline, federal cooperation, and mature-state design
    remain unresolved without a specific transition plan.
