claims:
- id: claim-pharmaceutical-drug-approvals-supply-001
  topic_slug: pharmaceutical-drug-approvals-supply
  text: Current sources show federal legal and regulatory baselines for drug approval,
    safety, compliance, recalls, and health-product information; they do not settle
    whether an independent Alberta would rely on Canadian approvals, create its own
    regulator, use mutual recognition, or face medicine-supply disruptions.
  status: source_supported
  source_ids: &id001
  - health-canada-drugs-health-products
  - food-and-drugs-act
  - canada-recalls-safety-alerts
  - health-canada-compliance-enforcement
  risk: medium
- id: claim-pharmaceutical-drug-approvals-supply-002
  topic_slug: pharmaceutical-drug-approvals-supply
  text: The strongest pro-independence case is that Alberta could negotiate recognition
    of existing drug approvals, preserve pharmacy supply during transition, and eventually
    design faster or more locally responsive procurement and regulatory pathways where
    evidence supports them.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-pharmaceutical-drug-approvals-supply-003
  topic_slug: pharmaceutical-drug-approvals-supply
  text: 'The strongest caution is that drug safety is not just purchasing: approvals,
    labelling, inspections, recalls, adverse-event monitoring, imports, shortages,
    and cross-border supply chains require trusted legal authority and regulator capacity
    before patients can rely on continuity.'
  status: inference
  source_ids: *id001
  risk: high
- id: claim-pharmaceutical-drug-approvals-supply-004
  topic_slug: pharmaceutical-drug-approvals-supply
  text: 'This topic remains uncertainty-labelled: High; outcomes depend on Health
    Canada arrangements, future Alberta regulator design, supply contracts, import
    permissions, pharmacy systems, federal-provincial health programs, manufacturers,
    wholesalers, and recall-data continuity.'
  status: source_supported
  source_ids: *id001
  risk: medium
