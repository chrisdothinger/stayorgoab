name: redebate-topic
on:
  workflow_dispatch:
    inputs:
      topic:
        required: false
        type: string
  schedule:
    - cron: "23 16 * * 2"
permissions:
  contents: read
jobs:
  redebate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:content
      - run: npm run validate:citations
      - run: npm run validate:public-audit
      - run: npm run validate:secrets
