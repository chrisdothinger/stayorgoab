claims:
- id: claim-statistics-census-public-data-001
  topic_slug: statistics-census-public-data
  text: Current public records show federal statistical and census systems alongside Alberta public-data products, but they do not establish how a new statistical agency, census authority, privacy rules, data sharing, historical comparability, or official indicators would operate after independence.
  status: source_supported
  source_ids: &id001
  - statistics-canada-main
  - statistics-canada-census
  - alberta-regional-dashboard
  risk: medium
- id: claim-statistics-census-public-data-002
  topic_slug: statistics-census-public-data
  text: The strongest pro-independence case is that Alberta could build a statistical system focused on provincial priorities, faster regional data products, open-data usability, and metrics designed around Alberta policy decisions if independence, comparability, and privacy safeguards were protected.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-statistics-census-public-data-003
  topic_slug: statistics-census-public-data
  text: The strongest anti-independence caution is that governments, businesses, researchers, municipalities, and residents could lose comparability or reliability if census authority, data sharing, survey capacity, privacy rules, historical series, or official indicators were not continuous.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-statistics-census-public-data-004
  topic_slug: statistics-census-public-data
  text: This topic remains medium-uncertainty because current official data baselines do not answer future statistical-agency design, census operations, privacy governance, data-sharing, or historical-comparability questions.
  status: inference
  source_ids: *id001
  risk: medium
