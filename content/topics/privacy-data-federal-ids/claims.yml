claims:
- id: claim-privacy-data-federal-ids-001
  topic_slug: privacy-data-federal-ids
  text: Current sources show federal SIN administration and federal/provincial privacy-law
    baselines; they do not settle whether an independent Alberta would keep SINs for
    transitional purposes, issue new identifiers, inherit federal records, or negotiate
    cross-border data-sharing arrangements.
  status: source_supported
  source_ids: &id001
  - service-canada-sin
  - privacy-act
  - pipeda
  - alberta-pipa-overview
  risk: medium
- id: claim-privacy-data-federal-ids-002
  topic_slug: privacy-data-federal-ids
  text: The strongest pro-independence case is that Alberta could write clear privacy
    and identity-continuity rules, protect existing service access during transition,
    and design a provincial digital-government model with stronger local accountability
    if it is backed by statute and implementation detail.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-privacy-data-federal-ids-003
  topic_slug: privacy-data-federal-ids
  text: The strongest caution is that identity systems touch taxes, payroll, benefits,
    banking, immigration, health records, education, law enforcement, and private-sector
    compliance; confusion over numbers, data custody, consent, and jurisdiction could
    affect ordinary services quickly.
  status: inference
  source_ids: *id001
  risk: high
- id: claim-privacy-data-federal-ids-004
  topic_slug: privacy-data-federal-ids
  text: 'This topic remains uncertainty-labelled: High; outcomes depend on Canada-Alberta
    agreements, future Alberta privacy statutes, records-transfer rules, public-sector
    system design, private-sector compliance, benefits and tax administration, banking
    requirements, and cybersecurity capacity.'
  status: source_supported
  source_ids: *id001
  risk: medium
