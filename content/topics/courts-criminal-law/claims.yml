claims:
- id: claim-courts-criminal-law-001
  topic_slug: courts-criminal-law
  text: Current public records show existing federal criminal-justice context and Alberta court services, but they do not settle how laws, prosecutions, courts, appeals, custody, or enforcement would transition under independence.
  status: source_supported
  source_ids: &id001
  - justice-canada-criminal-justice
  - alberta-courts
  - scc-secession-reference
  risk: medium
- id: claim-courts-criminal-law-002
  topic_slug: courts-criminal-law
  text: The strongest pro case is that a negotiated transition could preserve functioning courts while allowing Alberta to design justice institutions with clearer local accountability.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-courts-criminal-law-003
  topic_slug: courts-criminal-law
  text: The strongest caution is that criminal law, courts, appeals, corrections, policing interfaces, and constitutional rights cannot be casually replaced without legal and service-continuity risk.
  status: inference
  source_ids: *id001
  risk: medium
- id: claim-courts-criminal-law-004
  topic_slug: courts-criminal-law
  text: 'This topic remains uncertainty-labelled: Medium; criminal-law authority, court continuity, prosecutions, appeals, custody, enforcement, and transitional validity of existing orders remain conditional on future decisions and evidence.'
  status: source_supported
  source_ids: *id001
  risk: medium
