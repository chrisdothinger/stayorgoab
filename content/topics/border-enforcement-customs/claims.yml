claims:
- id: claim-border-enforcement-customs-001
  topic_slug: border-enforcement-customs
  text: Current sources show that Canadian border services, customs law, immigration administration, and immigration/admissibility law are federal Canadian functions today, while U.S. border procedures are controlled by U.S. authorities.
  status: source_supported
  source_ids: &border_sources
  - cbsa-main
  - customs-act
  - ircc-main
  - immigration-refugee-protection-act
  - us-cbp-main
  risk: medium
- id: claim-border-enforcement-customs-002
  topic_slug: border-enforcement-customs
  text: An independent Alberta would need explicit legal authority, institutions, staff, facilities, systems, and agreements before it could reliably inspect people and goods at new or changed borders.
  status: inference
  source_ids: *border_sources
  risk: high
- id: claim-border-enforcement-customs-003
  topic_slug: border-enforcement-customs
  text: The strongest pro-independence case is that Alberta could seek negotiated continuity and build a phased border/customs agency designed around Alberta trade and mobility priorities.
  status: inference
  source_ids: *border_sources
  risk: medium
- id: claim-border-enforcement-customs-004
  topic_slug: border-enforcement-customs
  text: The strongest anti-independence / pro-federation case is that seamless movement should not be assumed without signed Canada-Alberta and U.S.-related operating arrangements, tested customs systems, and clear traveller and shipper rules.
  status: inference
  source_ids: *border_sources
  risk: high
- id: claim-border-enforcement-customs-005
  topic_slug: border-enforcement-customs
  text: 'This topic remains uncertainty-labelled: high, because border outcomes depend on Canada-Alberta negotiations, U.S. recognition and procedures, customs systems, immigration rules, policing, infrastructure, staffing, budgets, data sharing, and implementation timelines.'
  status: source_supported
  source_ids: *border_sources
  risk: medium
