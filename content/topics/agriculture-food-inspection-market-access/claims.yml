claims:
- id: claim-agriculture-food-inspection-market-access-001
  topic_slug: agriculture-food-inspection-market-access
  text: "Current sources establish that Canada has federal food-inspection, export-certification, animal-health, plant-health, recall, agriculture-program, business risk management, and market-development institutions alongside Alberta agriculture and irrigation responsibilities; they do not establish post-independence continuity terms for inspection, certification, programs, or market access."
  status: source_supported
  source_ids: &topic_sources
  - cfia-main
  - cfia-exporting-food-plants-animals
  - cfia-animal-health
  - cfia-plant-health
  - cfia-food-recalls-allergy-alerts
  - agriculture-canada-main
  - aafc-brm-programs
  - aafc-agrimarketing-program
  - alberta-agriculture
  risk: medium
- id: claim-agriculture-food-inspection-market-access-002
  topic_slug: agriculture-food-inspection-market-access
  text: "The strongest pro-independence case is conditional: Alberta could seek negotiated continuity while designing agriculture policy, inspection priorities, business risk management choices, and trade promotion more directly around Alberta producers."
  status: inference
  source_ids: *topic_sources
  risk: medium
- id: claim-agriculture-food-inspection-market-access-003
  topic_slug: agriculture-food-inspection-market-access
  text: "The strongest anti-independence / pro-federation case is that inspection, export certification, animal-health and plant-health status, recall response, farm-program delivery, and market recognition require binding plans and external acceptance before producers and processors can safely rely on continuity."
  status: inference
  source_ids: *topic_sources
  risk: medium
- id: claim-agriculture-food-inspection-market-access-004
  topic_slug: agriculture-food-inspection-market-access
  text: "Alberta's existing agriculture ministry is relevant evidence of provincial agriculture capacity, but it is not evidence that Alberta could instantly replace all federal food-inspection, certification, animal-health, plant-health, recall, agriculture-program, and market-access functions."
  status: source_supported
  source_ids: *topic_sources
  risk: medium
- id: claim-agriculture-food-inspection-market-access-005
  topic_slug: agriculture-food-inspection-market-access
  text: "The practical test for this topic is a function-by-function continuity plan covering legal authority, inspection and export certificates, market recognition, staff, labs, records, active files, funding, emergency response, recalls, animal and plant health, risk management supports, and public instructions."
  status: inference
  source_ids: *topic_sources
  risk: medium
