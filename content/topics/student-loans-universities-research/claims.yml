claims:
- id: claim-student-loans-universities-research-001
  topic_slug: student-loans-universities-research
  text: Current sources establish federal student financial assistance, Alberta Student Aid, and
    federal tri-agency research funding as current baselines, but not post-independence transition
    terms.
  status: source_supported
  source_ids:
  - canada-student-financial-assistance
  - alberta-student-aid
  - tri-agency-research-funding
  risk: medium
- id: claim-student-loans-universities-research-002
  topic_slug: student-loans-universities-research
  text: A credible transition would need explicit rules for loan servicing, repayment assistance,
    grant eligibility, institutional funding, data transfer, and active research awards.
  status: inference
  source_ids:
  - canada-student-financial-assistance
  - alberta-student-aid
  - tri-agency-research-funding
  risk: medium
- id: claim-student-loans-universities-research-003
  topic_slug: student-loans-universities-research
  text: The pro-independence case is strongest where Alberta can build from its existing provincial
    student-aid system while explicitly preserving current loan, grant, and research commitments.
  status: inference
  source_ids:
  - alberta-student-aid
  - canada-student-financial-assistance
  - tri-agency-research-funding
  risk: medium
- id: claim-student-loans-universities-research-004
  topic_slug: student-loans-universities-research
  text: The anti-independence caution is strongest where students, universities, and researchers
    face fixed application, budget, repayment, and grant-cycle deadlines before replacement systems
    are proven.
  status: inference
  source_ids:
  - canada-student-financial-assistance
  - alberta-student-aid
  - tri-agency-research-funding
  risk: medium
