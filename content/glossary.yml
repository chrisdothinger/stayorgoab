terms:
  - term: "Citizen initiative petition"
    definition: "An Alberta process that can seek a legislative or policy proposal or a constitutional referendum."
  - term: "Clarity Act"
    definition: "Federal legislation setting clarity requirements before Canada enters negotiations on provincial secession."
  - term: "Full dossier"
    definition: "A topic state with overview, neutral report, pro report, anti report, claim ledger, source list, and audit history."
  - term: "Seed overview"
    definition: "A transparent early topic state with limited content and no claim of full research completion."
