claims:
- id: claim-pharmaceutical-drug-approvals-supply-001
  topic_slug: pharmaceutical-drug-approvals-supply
  text: Current sources establish Canadian legal and regulatory baselines for drug approvals,
    safety alerts, compliance, enforcement, recalls, and health-product information, but not Alberta
    independence transition terms.
  status: source_supported
  source_ids:
  - health-canada-drugs-health-products
  - food-and-drugs-act
  - canada-recalls-safety-alerts
  - health-canada-compliance-enforcement
  risk: high
- id: claim-pharmaceutical-drug-approvals-supply-002
  topic_slug: pharmaceutical-drug-approvals-supply
  text: A credible transition would need explicit arrangements for recognizing approvals, labelling,
    recalls, adverse-event reporting, import rules, pharmacy guidance, manufacturer guidance,
    and supply continuity.
  status: inference
  source_ids:
  - health-canada-drugs-health-products
  - food-and-drugs-act
  - canada-recalls-safety-alerts
  - health-canada-compliance-enforcement
  risk: high
- id: claim-pharmaceutical-drug-approvals-supply-003
  topic_slug: pharmaceutical-drug-approvals-supply
  text: The pro-independence case is strongest if Alberta can preserve current medicine access
    through recognition and supply bridges before attempting local regulatory redesign.
  status: inference
  source_ids:
  - health-canada-drugs-health-products
  - food-and-drugs-act
  - canada-recalls-safety-alerts
  risk: high
- id: claim-pharmaceutical-drug-approvals-supply-004
  topic_slug: pharmaceutical-drug-approvals-supply
  text: The anti-independence caution is strongest because medicine safety requires trusted legal
    authority, regulator capacity, recall channels, and supply-chain clarity before patients can
    rely on continuity.
  status: inference
  source_ids:
  - health-canada-drugs-health-products
  - food-and-drugs-act
  - canada-recalls-safety-alerts
  - health-canada-compliance-enforcement
  risk: high
